spring.application.name=barberia-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/barberia
spring.datasource.username=barberia_user
spring.datasource.password=barberia_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# CORS para el frontend React (Vite dev server)
app.cors.allowed-origins=http://localhost:5173
