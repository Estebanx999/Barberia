server:
  port: ${PORT:8080}   # en la nube el puerto lo asigna la plataforma

spring:
  application:
    name: barberia-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barberia}
    username: ${DB_USER:barberia}
    password: ${DB_PASSWORD:barberia}
    # En la nube basta DATABASE_URL (postgresql://...): ver config/ConexionDesdeUrl.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema se crea aparte; Hibernate solo lo verifica

barberia:
  horario:
    apertura: "08:00"
    cierre: "20:00"
    duracion-turno: 30m
    zona-horaria: America/Bogota
  seguridad:
    jwt-secreto: ${JWT_SECRETO}   # mínimo 32 caracteres; nunca se guarda en el repositorio
    duracion-token: 8h
