# Publicación en Render (https://render.com) con un Blueprint:
# Render lee este archivo del repositorio y crea la base y el servicio.
# Pasos y comandos en el README, sección "Publicación en la nube".

databases:
  - name: barberia-db
    databaseName: barberia
    user: barberia
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  # Un solo servicio: el backend sirve la API y la aplicación web (Dockerfile de la raíz).
  # Al abrir la página se despierta todo junto; en el plan gratuito tarda 1 a 2 minutos.
  - type: web
    name: barberia-backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barberia-db
          property: connectionString
      - key: JWT_SECRETO
        generateValue: true
      - key: PORT
        value: "8080"
      # Arranque más rápido con poca CPU: compila menos al iniciar.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75 -XX:TieredStopAtLevel=1"
