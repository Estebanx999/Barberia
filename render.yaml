# Publicación en Render (https://render.com) con un Blueprint:
# Render lee este archivo del repositorio y crea la base y los dos servicios.
# Pasos y comandos en el README, sección "Publicación en la nube".

databases:
  - name: barberia-db
    databaseName: barberia
    user: barberia
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: barberia-backend
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barberia-db
          property: connectionString
      - key: JWT_SECRETO
        generateValue: true
      - key: PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75"

  - type: web
    name: barberia-web
    runtime: docker
    plan: free
    region: virginia
    rootDir: frontend
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Dirección pública del backend, por ejemplo https://barberia-backend.onrender.com
      - key: BACKEND_URL
        sync: false
      - key: PORT
        value: "80"
